<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screening Call Registration</title>
  <style>
    :root {
      --ground: #f7f3ef;
      --card: #ffffff;
      --accent: #d94430;
      --accent-hover: #c13a28;
      --accent-soft: #fdf0ed;
      --accent-border: #f0c4bc;
      --text: #2d2219;
      --text-secondary: #97897a;
      --border: #e4ddd6;
      --input-bg: transparent;
      --option-bg: #faf7f4;
      --option-hover: #fdf0ed;
      --check-bg: #f5f1ed;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ground: #1a1612;
        --card: #252019;
        --accent: #e55846;
        --accent-hover: #f06a59;
        --accent-soft: #3a2420;
        --accent-border: #5a3530;
        --text: #ede6dd;
        --text-secondary: #9a8d7e;
        --border: #3d362e;
        --input-bg: transparent;
        --option-bg: #2e2820;
        --option-hover: #3a2e24;
        --check-bg: #2e2820;
      }
    }

    :root[data-theme="dark"] {
      --ground: #1a1612;
      --card: #252019;
      --accent: #e5584a;
      --accent-hover: #f06a59;
      --accent-soft: #3a2420;
      --accent-border: #5a3530;
      --text: #ede6dd;
      --text-secondary: #9a8d7e;
      --border: #3d362e;
      --input-bg: transparent;
      --option-bg: #2e2820;
      --option-hover: #3a2e24;
      --check-bg: #2e2820;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      background: var(--ground);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      color: var(--text);
    }

    .form-card {
      width: 100%;
      max-width: 540px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(45,34,25,0.04), 0 8px 32px rgba(45,34,25,0.06);
      padding: 52px 44px 44px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .form-card { animation: rise 0.45s cubic-bezier(0.22,1,0.36,1); }
      @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    }

    .logo { width: 56px; height: 56px; margin-bottom: 28px; }

    .form-intro { margin-bottom: 44px; }

    .step-marker {
      display: inline-block;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 12px; font-weight: 700;
      color: var(--accent); background: var(--accent-soft);
      width: 24px; height: 24px; line-height: 24px;
      text-align: center; border-radius: 6px; margin-bottom: 14px;
    }

    .form-intro p {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 19px; line-height: 1.55; color: var(--text);
      text-wrap: balance;
    }

    .req { color: var(--accent); }

    .field { margin-bottom: 36px; }

    .field-q {
      display: block;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 16px; line-height: 1.4; color: var(--text);
      margin-bottom: 12px;
    }

    .field-hint {
      display: block; font-size: 13px; color: var(--text-secondary);
      margin-bottom: 12px; letter-spacing: 0.01em;
    }

    input[type="text"], input[type="email"], input[type="tel"] {
      width: 100%; padding: 12px 0;
      border: none; border-bottom: 1.5px solid var(--border);
      font-family: inherit; font-size: 16px;
      color: var(--text); background: var(--input-bg);
      transition: border-color 0.2s ease; outline: none;
    }

    input:focus { border-bottom-color: var(--accent); }
    input::placeholder { color: var(--text-secondary); opacity: 0.6; }

    .phone-row {
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1.5px solid var(--border);
      transition: border-color 0.2s ease;
    }
    .phone-row:focus-within { border-bottom-color: var(--accent); }

    .country-select {
      padding: 12px 0; border: none; background: transparent;
      font-family: inherit; font-size: 16px;
      color: var(--text); cursor: pointer; outline: none;
    }

    .phone-row input[type="tel"] { border-bottom: none; flex: 1; }

    .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 480px) { .time-grid { grid-template-columns: 1fr; } }

    .time-slot { position: relative; }
    .time-slot input { position: absolute; opacity: 0; pointer-events: none; }

    .time-slot label {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; border: 1.5px solid var(--border);
      border-radius: 12px; background: var(--option-bg);
      cursor: pointer; transition: all 0.18s ease;
      font-size: 14px; color: var(--text); line-height: 1.3;
    }
    .time-slot label:hover { border-color: var(--accent-border); background: var(--option-hover); }
    .time-slot input:checked + label { border-color: var(--accent); background: var(--accent-soft); }
    .time-slot input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

    .slot-key {
      flex-shrink: 0; width: 26px; height: 26px; border-radius: 7px;
      background: var(--check-bg); display: flex; align-items: center;
      justify-content: center; font-size: 12px; font-weight: 700;
      color: var(--text-secondary); transition: all 0.18s ease;
    }
    .time-slot input:checked + label .slot-key { background: var(--accent); color: #fff; }

    .slot-text { display: flex; flex-direction: column; }
    .slot-name { font-weight: 600; font-size: 14px; }
    .slot-range { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }

    .consent-field { margin-bottom: 36px; }

    .consent-label {
      display: flex; align-items: flex-start; gap: 12px;
      cursor: pointer; position: relative;
    }
    .consent-label input { position: absolute; opacity: 0; pointer-events: none; }

    .check-box {
      flex-shrink: 0; width: 22px; height: 22px;
      border: 1.5px solid var(--border); border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.18s ease; margin-top: 1px;
    }
    .check-box svg { opacity: 0; transform: scale(0.6); transition: all 0.18s ease; }
    .consent-label input:checked ~ .check-box { background: var(--accent); border-color: var(--accent); }
    .consent-label input:checked ~ .check-box svg { opacity: 1; transform: scale(1); }
    .consent-label input:focus-visible ~ .check-box { outline: 2px solid var(--accent); outline-offset: 2px; }

    .consent-copy { font-size: 14px; line-height: 1.6; color: var(--text-secondary); }

    .submit-btn {
      width: 100%; padding: 16px;
      background: var(--accent); color: #fff; border: none;
      border-radius: 12px; font-family: inherit;
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
    }
    .submit-btn:hover { background: var(--accent-hover); box-shadow: 0 4px 16px rgba(217,68,48,0.25); transform: translateY(-1px); }
    .submit-btn:active { transform: translateY(0); box-shadow: none; }
    .submit-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

    .done { display: none; text-align: center; padding: 48px 16px; }
    .done-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--accent); display: inline-flex;
      align-items: center; justify-content: center; margin-bottom: 20px;
    }
    .done h2 { font-family: Georgia, 'Times New Roman', serif; font-size: 22px; font-weight: 400; color: var(--text); margin-bottom: 10px; }
    .done p { font-size: 15px; color: var(--text-secondary); line-height: 1.6; max-width: 340px; margin: 0 auto; }

    @media (prefers-reduced-motion: no-preference) {
      .done-icon { animation: pop 0.4s cubic-bezier(0.22,1,0.36,1); }
      @keyframes pop { 0% { transform:scale(0); } 70% { transform:scale(1.08); } 100% { transform:scale(1); } }
    }

    .error-msg { color: var(--accent); font-size: 13px; margin-top: 8px; display: none; }

    @media (max-width: 560px) {
      .form-card { padding: 36px 24px 32px; border-radius: 16px; }
      .form-intro p { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="form-card">
    <svg class="logo" viewBox="0 0 56 56" fill="none" aria-hidden="true">
      <rect width="56" height="56" rx="16" fill="var(--accent)"/>
      <circle cx="20" cy="22" r="3.5" fill="#fff"/>
      <circle cx="36" cy="22" r="3.5" fill="#fff"/>
      <path d="M17 31c3.5 7 18.5 7 22 0" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </svg>

    <form id="screeningForm" novalidate>
      <div class="form-intro">
        <span class="step-marker">1</span>
        <p>Please provide the information below so we can confirm eligibility and schedule a screening call.<span class="req">*</span></p>
      </div>

      <div class="field">
        <label class="field-q" for="fullName">What is your full name?</label>
        <input type="text" id="fullName" name="fullName" placeholder="Type your answer here..." required>
      </div>

      <div class="field">
        <label class="field-q" for="phone">What is the best phone number to reach you?</label>
        <div class="phone-row">
          <select class="country-select" id="countryCode" name="countryCode" aria-label="Country code">
            <option value="+1">🇺🇸 +1</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+972">🇮🇱 +972</option>
            <option value="+49">🇩🇪 +49</option>
            <option value="+33">🇫🇷 +33</option>
            <option value="+61">🇦🇺 +61</option>
            <option value="+81">🇯🇵 +81</option>
            <option value="+86">🇨🇳 +86</option>
            <option value="+91">🇮🇳 +91</option>
            <option value="+52">🇲🇽 +52</option>
            <option value="+55">🇧🇷 +55</option>
          </select>
          <input type="tel" id="phone" name="phone" placeholder="(201) 555-0123" required>
        </div>
      </div>

      <div class="field">
        <label class="field-q" for="email">What's your email address?</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>

      <div class="field">
        <label class="field-q" for="language">What language do you prefer to communicate in?</label>
        <input type="text" id="language" name="language" placeholder="Type your answer here...">
      </div>

      <div class="field">
        <label class="field-q">What is your preferred time of day for a screening call?</label>
        <span class="field-hint">Choose as many as you like</span>
        <div class="time-grid">
          <div class="time-slot">
            <input type="checkbox" id="t-am" name="preferredTime" value="Morning (9–12)">
            <label for="t-am"><span class="slot-key">A</span><span class="slot-text"><span class="slot-name">Morning</span><span class="slot-range">9:00 AM – 12:00 PM</span></span></label>
          </div>
          <div class="time-slot">
            <input type="checkbox" id="t-ea" name="preferredTime" value="Early Afternoon (12–3)">
            <label for="t-ea"><span class="slot-key">B</span><span class="slot-text"><span class="slot-name">Early Afternoon</span><span class="slot-range">12:00 PM – 3:00 PM</span></span></label>
          </div>
          <div class="time-slot">
            <input type="checkbox" id="t-la" name="preferredTime" value="Late Afternoon (3–6)">
            <label for="t-la"><span class="slot-key">C</span><span class="slot-text"><span class="slot-name">Late Afternoon</span><span class="slot-range">3:00 PM – 6:00 PM</span></span></label>
          </div>
          <div class="time-slot">
            <input type="checkbox" id="t-ev" name="preferredTime" value="Evening (6–8)">
            <label for="t-ev"><span class="slot-key">D</span><span class="slot-text"><span class="slot-name">Evening</span><span class="slot-range">6:00 PM – 8:00 PM</span></span></label>
          </div>
        </div>
      </div>

      <div class="consent-field">
        <span class="field-q">Consent to Contact<span class="req">*</span></span>
        <label class="consent-label">
          <input type="checkbox" id="consent" name="consent" required>
          <span class="check-box">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M2 6.5L5 9.5L11 3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="consent-copy">I agree to be contacted for a screening call regarding eligibility and services.</span>
        </label>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
      <p class="error-msg" id="errorMsg"></p>
    </form>

    <div class="done" id="done">
      <div class="done-icon">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
          <path d="M7 15L12.5 20.5L23 9.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2>Thank you</h2>
      <p>Your information has been submitted. We'll be in touch soon to schedule your screening call.</p>
    </div>
  </div>

  <script>
    // =====================================================
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    var SCRIPT_URL = '';
    // =====================================================

    document.getElementById('phone').addEventListener('input', function(e) {
      var v = e.target.value.replace(/\D/g, '');
      if (v.length <= 3) v = v.length ? '(' + v : '';
      else if (v.length <= 6) v = '(' + v.slice(0, 3) + ') ' + v.slice(3);
      else v = '(' + v.slice(0, 3) + ') ' + v.slice(3, 6) + '-' + v.slice(6, 10);
      e.target.value = v;
    });

    document.getElementById('screeningForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';

      var times = [];
      document.querySelectorAll('input[name="preferredTime"]:checked').forEach(function(cb) {
        times.push(cb.value);
      });

      var data = {
        fullName: document.getElementById('fullName').value.trim(),
        phone: document.getElementById('countryCode').value + ' ' + document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim(),
        language: document.getElementById('language').value.trim(),
        preferredTime: times,
        consent: document.getElementById('consent').checked
      };

      if (!data.fullName || !data.email || !data.consent) {
        errEl.textContent = 'Please fill in all required fields.';
        errEl.style.display = 'block';
        return;
      }

      if (!SCRIPT_URL) {
        showSuccess();
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Submitting...';

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(data)
      })
      .then(function() { showSuccess(); })
      .catch(function() {
        errEl.textContent = 'Something went wrong. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit';
      });
    });

    function showSuccess() {
      var form = document.getElementById('screeningForm');
      var done = document.getElementById('done');
      form.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
      form.style.opacity = '0';
      form.style.transform = 'translateY(-8px)';
      setTimeout(function() { form.style.display = 'none'; done.style.display = 'block'; }, 260);
    }
  </script>
</body>
</html>
